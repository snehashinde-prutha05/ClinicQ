<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="5">
<title>Now serving · ClinicQ</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head><body>
<main class="board" aria-live="polite"><div>
  <div class="lbl">Now serving</div>
  <div class="num" id="board-now">{{ ('%02d' % serving.token_no) if serving else '—' }}</div>
  {% if nxt %}<div class="next">Next: {% for t in nxt %}<b>{{ '%02d' % t.token_no }}</b>{% endfor %}</div>{% endif %}
</div></main></body></html>
